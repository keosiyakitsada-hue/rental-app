// ---------- Subscription status ----------
function subInfo() {
  const s = S.sub, now = Date.now();
  if (!s) return { ok: false, t: tt('sub.none') };
  const end = s.status === 'trial' ? s.trial_ends_at : s.current_period_end;
  if (s.status === 'trial') {
    const ok = new Date(end) > now;
    return { ok, t: ok ? tt('sub.trial', { d: Math.ceil((new Date(end) - now) / 864e5) }) : tt('sub.trial_end') };
  }
  if (s.status === 'active') {
    if (!end) return { ok: true, t: tt('sub.free') };
    const ok = new Date(end) > now;
    return { ok, t: ok ? tt('sub.active', { plan: s.plans.name, date: new Date(end).toLocaleDateString('en-GB') }) : tt('sub.expired') };
  }
  return { ok: false, t: tt('sub.off') };
}

// ---------- Main ----------
async function load() {
  try { await _load(); }
  catch (e) {
    app.className = 'wrap';
    app.innerHTML = `<div class="card"><h2>ໂຫຼດຂໍ້ມູນບໍ່ໄດ້ / Could not load data</h2><p class="msg">${esc(e.message || e)}</p><div class="row"><button onclick="location.reload()">ລອງໃໝ່ / Retry</button></div></div>`;
  }
}
async function _load() {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  if (!S.user) return renderAuth();
  const { data: mem } = await sb.from('org_members').select('role, organizations(id,name)').order('created_at');
  if (!mem?.length) return renderCreateOrg();
  let saved = null; try { saved = localStorage.getItem('rm_org'); } catch (e) {}
  const cur = mem.find(m => m.organizations.id === saved) || mem[0];
  S.mems = mem; S.org = cur.organizations; S.role = cur.role;
  const [sub, plans, adm] = await Promise.all([
    sb.from('subscriptions').select('*, plans(*)').eq('org_id', S.org.id).single(),
    sb.from('plans').select('*').order('price_lak'),
    sb.rpc('is_platform_admin')
  ]);
  S.sub = sub.data; S.plans = plans.data || []; S.isAdmin = adm.data === true;
  renderApp();
}

// ---------- Dashboard (all numbers come from RLS-protected queries) ----------
async function viewDash() {
  const v = $('#view'); v.innerHTML = LOADING;
  const som = new Date().toISOString().slice(0, 7) + '-01';
  const fin = ['owner', 'manager'].includes(S.role);
  const [r, i] = await Promise.all([
    sb.from('rooms').select('status,rent_lak').eq('org_id', S.org.id),
    fin ? sb.from('invoices').select('month,total_lak,status,rooms(room_no),tenants(name)').eq('org_id', S.org.id).order('created_at', { ascending: false }).limit(500) : Promise.resolve({ data: [] })
  ]);
  if (r.error) return showErr(v, r.error);
  if (i.error) return showErr(v, i.error);
  const rooms = r.data || [], inv = i.data || [];
  const occ = rooms.filter(x => x.status === 'occupied'), sum = a => a.reduce((t, x) => t + Number(x.total_lak ?? x.rent_lak), 0);
  const unpaid = inv.filter(x => x.status === 'unpaid');
  const money = n => `${fmt(n)} <small ${I('u.lak')}>${tt('u.lak')}</small>`;
  const fkpi = (...a) => (fin ? kpi(...a) : '');
  const kpi = (k, c, ic, val) => `<div class="kpi" style="--k:var(--${c})"><div class="ico"><i data-lucide="${ic}"></i></div><span class="mute" ${I(k)}>${tt(k)}</span><b>${val}</b></div>`;
  const rows = (list, key) => list.length ? list.slice(0, 5).map(x => `<div class="item"><div><b><span ${I('u.room')}>${tt('u.room')}</span> ${esc(x.rooms?.room_no)}</b><br><span class="mute">${esc(x.tenants?.name || '-')} · ${x.month.slice(0, 7)}</span></div><b>${fmt(x.total_lak)}</b></div>`).join('') : `<div class="empty" ${I('dash.none')}>${tt('dash.none')}</div>`;
  v.innerHTML = `<div class="kpis">
  ${fkpi('kpi.expected', 'c1', 'wallet', money(sum(occ)))}
  ${fkpi('kpi.collected', 'c2', 'badge-check', money(sum(inv.filter(x => x.status === 'paid' && x.month >= som))))}
  ${fkpi('kpi.outstanding', 'c4', 'clock', money(sum(unpaid)))}
  ${kpi('kpi.occ', 'c5', 'percent', (rooms.length ? Math.round(occ.length / rooms.length * 100) : 0) + '%')}
  ${kpi('kpi.total', 'c6', 'building-2', rooms.length)}
  ${kpi('kpi.vacant', 'c3', 'door-open', rooms.length - occ.length)}
  ${kpi('kpi.occupied', 'c7', 'users', occ.length)}</div>
  <div class="cols"><div class="card"><h2 ${I('dash.unpaid')}>${tt('dash.unpaid')}</h2>${rows(unpaid.slice().reverse())}</div>
  <div class="card"><h2 ${I('dash.recent')}>${tt('dash.recent')}</h2>${rows(inv)}</div></div>`;
  if (!fin) v.querySelector('.cols')?.remove();
}

  $('#add').onclick = e => busy(e.target, async () => {
    const no = $('#rn').value.trim(), rent = Number($('#rr').value || 0);
    if (!no) return setMsg('ກະລຸນາໃສ່ເລກຫ້ອງ');
    let { data: props } = await sb.from('properties').select('id').eq('org_id', S.org.id).limit(1);
    if (!props?.length) {
      const ins = await sb.from('properties').insert({ org_id: S.org.id, name: 'ຫໍພັກຫຼັກ' }).select('id');
      if (ins.error) return setMsg(ins.error.message);
      props = ins.data;
    }
    const { error } = await sb.from('rooms').insert({ org_id: S.org.id, property_id: props[0].id, room_no: no, rent_lak: rent });
    if (error) return setMsg(error.message.includes('limit') ? 'ຫ້ອງເຕັມຕາມແພັກເກັດ ກະລຸນາອັບເກຣດ' : error.message.includes('duplicate') ? 'ເລກຫ້ອງນີ້ມີແລ້ວ' : error.message);
    viewRooms();
  });
}

// ---------- Tenants ----------
const canW = () => subInfo().ok && ['owner', 'manager'].includes(S.role);
const LOADING = '<p class="mute">ກຳລັງໂຫຼດ...</p>';
const showErr = (v, e) => { v.innerHTML = `<div class="card"><p class="msg">ໂຫຼດຂໍ້ມູນບໍ່ໄດ້: ${esc(e.message)}</p></div>`; };

async function viewTenants() {
  const v = $('#view'); v.innerHTML = LOADING;
  const [t, r] = await Promise.all([
    sb.from('tenants').select('*, rooms(room_no)').eq('org_id', S.org.id).eq('active', true).order('created_at', { ascending: false }),
    sb.from('rooms').select('id,room_no').eq('org_id', S.org.id).eq('status', 'vacant').order('room_no')
  ]);
  if (t.error) return showErr(v, t.error);
  const list = t.data || [], vac = r.data || [], w = canW();
  v.innerHTML = `<div class="card"><h2>ຜູ້ເຊົ່າປັດຈຸບັນ (${list.length})</h2>
  ${list.length ? list.map(x => `<div class="item"><div><b>${esc(x.name)}</b> · ຫ້ອງ ${esc(x.rooms.room_no)}<br><span class="mute">${esc(x.phone || 'ບໍ່ມີເບີໂທ')} · ເລີ່ມ ${x.start_date}</span></div>${w ? `<button class="ghost sm" data-end="${x.id}">ສິ້ນສຸດ</button>` : ''}</div>`).join('') : '<div class="empty"><i data-lucide="users"></i>ຍັງບໍ່ມີຜູ້ເຊົ່າ</div>'}</div>
  ${w ? `<div class="card"><h2>ເພີ່ມຜູ້ເຊົ່າ</h2>${vac.length ? `
  <label>ຫ້ອງວ່າງ</label><select id="tr">${vac.map(x => `<option value="${x.id}">ຫ້ອງ ${esc(x.room_no)}</option>`).join('')}</select>
  <label>ຊື່ຜູ້ເຊົ່າ</label><input id="tn">
  <label>ເບີໂທ / WhatsApp</label><input id="tp" type="tel" placeholder="020 5xxx xxxx">
  <label>ວັນເລີ່ມສັນຍາ</label><input id="td" type="date" value="${new Date().toISOString().slice(0, 10)}">
  <div class="row"><button id="ta"><i data-lucide="user-plus"></i>ເພີ່ມຜູ້ເຊົ່າ</button></div><div id="msg" class="msg"></div>` : '<p class="mute">ບໍ່ມີຫ້ອງວ່າງ. ເພີ່ມຫ້ອງໃນແຖບ "ຫ້ອງ" ກ່ອນ</p>'}</div>` : ''}`;
  v.querySelectorAll('[data-end]').forEach(b => b.onclick = () => {
    if (!confirm('ສິ້ນສຸດສັນຍາຂອງຜູ້ເຊົ່ານີ້?')) return;
    busy(b, async () => {
      const { error } = await sb.from('tenants').update({ active: false, end_date: new Date().toISOString().slice(0, 10) }).eq('id', b.dataset.end);
      error ? alert(error.message) : viewTenants();
    });
  });
  if ($('#ta')) $('#ta').onclick = e => busy(e.target, async () => {
    const name = $('#tn').value.trim();
    if (!name) return setMsg('ກະລຸນາໃສ່ຊື່ຜູ້ເຊົ່າ');
    const { error } = await sb.from('tenants').insert({ org_id: S.org.id, room_id: $('#tr').value, name, phone: $('#tp').value.trim() || null, start_date: $('#td').value || undefined });
    error ? setMsg(error.message) : viewTenants();
  });
}

// ---------- Meter + Invoices ----------
function waLink(i) {
  let p = (i.tenants?.phone || '').replace(/\D/g, '');
  if (!p) return '';
  p = p.startsWith('856') ? p : '856' + p.replace(/^0+/, '');
  const t = `ໃບແຈ້ງໜີ້ ຫ້ອງ ${i.rooms.room_no} ເດືອນ ${i.month.slice(0, 7)}\nຄ່າເຊົ່າ: ${fmt(i.rent_lak)} ກີບ\nຄ່ານ້ຳ ${i.water_units} ໜ່ວຍ: ${fmt(i.water_lak)} ກີບ\nຄ່າໄຟ ${i.elec_units} ໜ່ວຍ: ${fmt(i.elec_lak)} ກີບ\nລວມທັງໝົດ: ${fmt(i.total_lak)} ກີບ`;
  return `https://wa.me/${p}?text=${encodeURIComponent(t)}`;
}

async function viewBills() {
  const v = $('#view'); v.innerHTML = LOADING;
  const [pr, oc, inv] = await Promise.all([
    sb.from('properties').select('id,water_rate,elec_rate').eq('org_id', S.org.id).limit(1),
    sb.from('tenants').select('id, rooms(id,room_no,rent_lak)').eq('org_id', S.org.id).eq('active', true),
    sb.from('invoices').select('*, rooms(room_no), tenants(name,phone)').eq('org_id', S.org.id).order('created_at', { ascending: false }).limit(20)
  ]);
  if (inv.error) return showErr(v, inv.error);
  const prop = pr.data?.[0], occ = (oc.data || []).filter(x => x.rooms), list = inv.data || [], w = canW();
  const month = new Date().toISOString().slice(0, 7);
  v.innerHTML = `${w && prop ? `<div class="card"><h2>ລາຄານ້ຳ-ໄຟ (ກີບ/ໜ່ວຍ)</h2><div class="grid2">
  <div><label>ນ້ຳ</label><input id="wr" type="number" inputmode="numeric" value="${prop.water_rate}"></div>
  <div><label>ໄຟ</label><input id="er" type="number" inputmode="numeric" value="${prop.elec_rate}"></div></div>
  <div class="row"><button class="ghost sm" id="sr">ບັນທຶກລາຄາ</button></div></div>` : ''}
  ${w ? `<div class="card"><h2>ຈົດມິເຕີ ແລະອອກບິນ</h2>${prop && occ.length ? `
  <label>ຫ້ອງ</label><select id="mr">${occ.map(x => `<option value="${x.rooms.id}" data-rent="${x.rooms.rent_lak}" data-tenant="${x.id}">ຫ້ອງ ${esc(x.rooms.room_no)}</option>`).join('')}</select>
  <label>ເດືອນ</label><input id="mm" type="month" value="${month}">
  <div class="grid2"><div><label>ນ້ຳ: ເລກກ່ອນ</label><input id="wp" type="number" inputmode="numeric" value="0"></div>
  <div><label>ນ້ຳ: ເລກປັດຈຸບັນ</label><input id="wc" type="number" inputmode="numeric"></div>
  <div><label>ໄຟ: ເລກກ່ອນ</label><input id="ep" type="number" inputmode="numeric" value="0"></div>
  <div><label>ໄຟ: ເລກປັດຈຸບັນ</label><input id="ec" type="number" inputmode="numeric"></div></div>
  <div class="row"><button id="mb"><i data-lucide="receipt"></i>ບັນທຶກ ແລະອອກບິນ</button></div><div id="msg" class="msg"></div>`
  : '<p class="mute">ຕ້ອງມີຫ້ອງທີ່ມີຜູ້ເຊົ່າກ່ອນ. ເພີ່ມໃນແຖບ "ຜູ້ເຊົ່າ"</p>'}</div>` : ''}
  <div class="card"><h2>ໃບແຈ້ງໜີ້ລ່າສຸດ</h2>
  ${list.length ? list.map(i => { const link = waLink(i), paid = i.status === 'paid'; return `<div class="item col">
  <div style="display:flex;justify-content:space-between;gap:10px"><div><b>ຫ້ອງ ${esc(i.rooms.room_no)}</b> · ${i.month.slice(0, 7)}<br><span class="mute">${esc(i.tenants?.name || '-')}</span></div>
  <div style="text-align:right"><b>${fmt(i.total_lak)}</b><br><span class="chip ${paid ? 'o' : 'v'}">${paid ? 'ຈ່າຍແລ້ວ' : 'ຄ້າງຊຳລະ'}</span></div></div>
  <div class="mute">ເຊົ່າ ${fmt(i.rent_lak)} · ນ້ຳ ${fmt(i.water_lak)} · ໄຟ ${fmt(i.elec_lak)}</div>
  ${(!paid && w) || link ? `<div class="row" style="margin-top:4px">${!paid && w ? `<button class="sm" data-paid="${i.id}"><i data-lucide="check"></i>ຈ່າຍແລ້ວ</button>` : ''}${link ? `<a class="lnk" href="${link}" target="_blank" rel="noopener"><i data-lucide="send"></i>WhatsApp</a>` : ''}</div>` : ''}</div>`; }).join('') : '<div class="empty"><i data-lucide="receipt"></i>ຍັງບໍ່ມີໃບແຈ້ງໜີ້</div>'}</div>`;

  if ($('#sr')) $('#sr').onclick = e => busy(e.target, async () => {
    const { error } = await sb.from('properties').update({ water_rate: Number($('#wr').value), elec_rate: Number($('#er').value) }).eq('id', prop.id);
    error ? alert(error.message) : viewBills();
  });
  if ($('#mr')) {
    const fillPrev = async () => {
      const { data } = await sb.from('meter_readings').select('water_curr,elec_curr').eq('room_id', $('#mr').value).order('month', { ascending: false }).limit(1);
      $('#wp').value = data?.[0]?.water_curr ?? 0; $('#ep').value = data?.[0]?.elec_curr ?? 0;
    };
    $('#mr').onchange = fillPrev; fillPrev();
    $('#mb').onclick = e => busy(e.target, async () => {
      const opt = $('#mr').selectedOptions[0];
      const wp = Number($('#wp').value), ep = Number($('#ep').value);
      if (!$('#mm').value || $('#wc').value === '' || $('#ec').value === '') return setMsg('ກະລຸນາໃສ່ເລກມິເຕີປັດຈຸບັນ ທັງນ້ຳ ແລະໄຟ');
      const wc = Number($('#wc').value), ec = Number($('#ec').value);
      if (wc < wp || ec < ep) return setMsg('ເລກປັດຈຸບັນຕ້ອງບໍ່ນ້ອຍກວ່າເລກກ່ອນ');
      const mo = $('#mm').value + '-01', room = opt.value;
      const r1 = await sb.from('meter_readings').insert({ org_id: S.org.id, room_id: room, month: mo, water_prev: wp, water_curr: wc, elec_prev: ep, elec_curr: ec });
      if (r1.error) return setMsg(r1.error.message.includes('duplicate') ? 'ຫ້ອງນີ້ຈົດມິເຕີເດືອນນີ້ແລ້ວ' : r1.error.message);
      const wl = (wc - wp) * prop.water_rate, el = (ec - ep) * prop.elec_rate, rent = Number(opt.dataset.rent);
      const r2 = await sb.from('invoices').insert({ org_id: S.org.id, room_id: room, tenant_id: opt.dataset.tenant, month: mo, rent_lak: rent, water_units: wc - wp, water_lak: wl, elec_units: ec - ep, elec_lak: el, total_lak: rent + wl + el });
      r2.error ? setMsg(r2.error.message) : viewBills();
    });
  }
  v.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => busy(b, async () => {
    const { error } = await sb.from('invoices').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('id', b.dataset.paid);
    error ? alert(error.message) : viewBills();
  }));
}

// ---------- Plans + slip upload ----------
async function viewPlans() {
  const v = $('#view');
  const paid = S.plans.filter(p => p.price_lak > 0);
  const { data: subs } = await sb.from('payment_submissions').select('*, plans(name)').eq('org_id', S.org.id).order('created_at', { ascending: false }).limit(5);
  const st = { pending: 'ລໍຖ້າກວດສອບ', approved: 'ອະນຸມັດແລ້ວ', rejected: 'ຖືກປະຕິເສດ' };
  v.innerHTML = `<div class="card"><h2>ເລືອກແພັກເກັດ</h2>
  ${paid.map(p => `<div class="item"><div><b>${esc(p.name)}</b><br><span class="mute">${p.max_rooms ? 'ບໍ່ເກີນ ' + p.max_rooms + ' ຫ້ອງ' : 'ບໍ່ຈຳກັດຫ້ອງ'}</span></div><b>${fmt(p.price_lak)} ກີບ</b></div>`).join('')}
  <p class="mute">${esc(BANK_INFO)}</p>
  <label>ແພັກເກັດທີ່ຈ່າຍ</label><select id="pp">${paid.map(p => `<option value="${p.id}" data-a="${p.price_lak}">${esc(p.name)} - ${fmt(p.price_lak)} ກີບ/30 ວັນ</option>`).join('')}</select>
  <label>ຮູບສະລິບການໂອນ</label><input id="sf" type="file" accept="image/*">
  <div class="row"><button id="send"><i data-lucide="upload"></i>ສົ່ງສະລິບຢືນຢັນ</button></div><div id="msg" class="msg"></div></div>
  ${subs?.length ? `<div class="card"><h2>ປະຫວັດການຈ່າຍ</h2>${subs.map(s => `<div class="item"><div>${esc(s.plans.name)} · ${fmt(s.amount_lak)} ກີບ<br><span class="mute">${new Date(s.created_at).toLocaleDateString('en-GB')}</span></div><span class="tag">${st[s.status]}</span></div>`).join('')}</div>` : ''}`;
  $('#send').onclick = e => busy(e.target, async () => {
    const f = $('#sf').files[0];
    if (!f) return setMsg('ກະລຸນາເລືອກຮູບສະລິບ');
    const opt = $('#pp').selectedOptions[0];
    const ext = (f.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '').toLowerCase();
    const path = `${S.org.id}/${Date.now()}.${ext}`;
    const up = await sb.storage.from('slips').upload(path, f);
    if (up.error) return setMsg('ອັບໂຫຼດບໍ່ສຳເລັດ: ' + up.error.message);
    const { error } = await sb.from('payment_submissions').insert({ org_id: S.org.id, plan_id: opt.value, amount_lak: Number(opt.dataset.a), slip_path: path });
    if (error) return setMsg(error.message);
    viewPlans();
  });
}

// ---------- Admin ----------
async function viewAdmin() {
  const v = $('#view');
  const { data: list } = await sb.from('payment_submissions').select('*, plans(name), organizations(name)').eq('status', 'pending').order('created_at');
  const rows = await Promise.all((list || []).map(async s => ({ ...s, url: (await sb.storage.from('slips').createSignedUrl(s.slip_path, 600)).data?.signedUrl })));
  v.innerHTML = `<div class="card"><h2>ສະລິບລໍຖ້າອະນຸມັດ (${rows.length})</h2>
  ${rows.length ? rows.map(s => `<div class="item" style="flex-direction:column"><div><b>${esc(s.organizations.name)}</b> · ${esc(s.plans.name)} · ${fmt(s.amount_lak)} ກີບ<br>
  ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">ເປີດເບິ່ງສະລິບ</a>` : '<span class="mute">ເບິ່ງສະລິບບໍ່ໄດ້</span>'}</div>
  <div class="row"><button data-ok="${s.id}"><i data-lucide="check"></i>ອະນຸມັດ</button><button class="bad" data-no="${s.id}"><i data-lucide="x"></i>ປະຕິເສດ</button></div></div>`).join('') : '<p class="mute">ບໍ່ມີລາຍການລໍຖ້າ</p>'}<div id="msg" class="msg"></div></div>`;
  v.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => busy(b, async () => {
    const { error } = await sb.rpc('approve_payment', { p_submission: b.dataset.ok });
    error ? setMsg(error.message) : viewAdmin();
  }));
  v.querySelectorAll('[data-no]').forEach(b => b.onclick = () => busy(b, async () => {
    const { error } = await sb.rpc('reject_payment', { p_submission: b.dataset.no });
    error ? setMsg(error.message) : viewAdmin();
  }));
}
